<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Exchange Rate Dashboard</title>
    
    <!-- Chart.js for charting -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            color: white;
            margin-bottom: 30px;
            text-align: center;
        }
        
        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        header p {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .controls {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .control-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        label {
            font-weight: 600;
            color: #333;
        }
        
        select, button {
            padding: 8px 15px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        select {
            background: white;
            color: #333;
        }
        
        select:hover, select:focus {
            border-color: #667eea;
            outline: none;
        }
        
        button {
            background: #667eea;
            color: white;
            border: none;
            font-weight: 600;
        }
        
        button:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        
        .status {
            font-size: 0.9em;
            padding: 5px 10px;
            border-radius: 5px;
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .status.success {
            background: #d4edda;
            color: #155724;
        }
        
        .status.error {
            background: #f8d7da;
            color: #721c24;
        }
        
        .status.loading {
            background: #d1ecf1;
            color: #0c5460;
        }
        
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        
        .status-dot.success {
            background: #28a745;
        }
        
        .status-dot.error {
            background: #dc3545;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s, box-shadow 0.3s;
        }
        
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 12px rgba(0, 0, 0, 0.15);
        }
        
        .card h2 {
            color: #333;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            color: #999;
        }
        
        .card .value {
            font-size: 2.5em;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 15px;
        }
        
        .metrics {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 15px;
            border-top: 2px solid #f0f0f0;
            padding-top: 15px;
        }
        
        .metric {
            display: flex;
            flex-direction: column;
        }
        
        .metric-label {
            font-size: 0.8em;
            color: #999;
            text-transform: uppercase;
            margin-bottom: 5px;
        }
        
        .metric-value {
            font-size: 1.4em;
            font-weight: 600;
            color: #333;
        }
        
        .metric-value.positive {
            color: #28a745;
        }
        
        .metric-value.negative {
            color: #dc3545;
        }
        
        .chart-container {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }
        
        .chart-container h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.3em;
        }
        
        canvas {
            max-height: 400px;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: white;
            font-size: 1.2em;
        }
        
        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            border-left: 4px solid #dc3545;
        }
        
        .info-message {
            background: #d1ecf1;
            color: #0c5460;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            border-left: 4px solid #17a2b8;
        }
        
        @media (max-width: 768px) {
            header h1 {
                font-size: 1.8em;
            }
            
            .controls {
                flex-direction: column;
            }
            
            .status {
                margin-left: 0;
            }
            
            .grid {
                grid-template-columns: 1fr;
            }
            
            .card .value {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>💱 Exchange Rate Dashboard</h1>
            <p>Real-time currency tracking and analysis</p>
        </header>
        
        <div class="controls">
            <div class="control-group">
                <label for="currency-select">Currency Pair:</label>
                <select id="currency-select">
                    <option value="EUR">EUR/USD</option>
                    <option value="GBP">GBP/USD</option>
                    <option value="JPY">JPY/USD</option>
                    <option value="CHF">CHF/USD</option>
                    <option value="CAD">CAD/USD</option>
                    <option value="AUD">AUD/USD</option>
                </select>
            </div>
            
            <button id="pull-button">📥 Pull Data Now</button>
            <button id="refresh-button">🔄 Refresh</button>
            
            <div class="status" id="status">
                <span class="status-dot loading"></span>
                <span>Loading...</span>
            </div>
        </div>
        
        <div id="error-container"></div>
        <div id="info-container"></div>
        
        <div class="grid">
            <div class="card">
                <h2>Current Rate</h2>
                <div class="value" id="current-rate">--</div>
                <div class="metric">
                    <span class="metric-label">Last Updated</span>
                    <span class="metric-value" id="last-updated">--</span>
                </div>
            </div>
            
            <div class="card">
                <h2>Change (Since Last Pull)</h2>
                <div class="value" id="change-value">--</div>
                <div class="metrics">
                    <div class="metric">
                        <span class="metric-label">Absolute</span>
                        <span class="metric-value" id="change-absolute">--</span>
                    </div>
                    <div class="metric">
                        <span class="metric-label">Percent</span>
                        <span class="metric-value" id="change-percent">--</span>
                    </div>
                </div>
            </div>
            
            <div class="card">
                <h2>7-Day Statistics</h2>
                <div class="metrics">
                    <div class="metric">
                        <span class="metric-label">Average</span>
                        <span class="metric-value" id="rolling-avg">--</span>
                    </div>
                    <div class="metric">
                        <span class="metric-label">Min</span>
                        <span class="metric-value" id="min-value">--</span>
                    </div>
                    <div class="metric">
                        <span class="metric-label">Max</span>
                        <span class="metric-value" id="max-value">--</span>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="chart-container">
            <h2>Historical Rates</h2>
            <canvas id="rate-chart"></canvas>
        </div>
    </div>
    
    <script>
        // Configuration
        const API_BASE = "http://127.0.0.1:5000";
        const REFRESH_INTERVAL = 10000; // Refresh every 10 seconds
        
        // State
        let currentCurrency = "EUR";
        let chart = null;
        let refreshTimer = null;
        
        /**
         * Format a number to a fixed number of decimal places.
         */
        function formatNumber(value, decimals = 4) {
            if (value === null || value === undefined || isNaN(value)) return "--";
            return parseFloat(value).toFixed(decimals);
        }
        
        /**
         * Format a percentage with color coding.
         * Returns HTML with the value colored green (positive) or red (negative).
         */
        function formatPercentage(value) {
            if (value === null || value === undefined || isNaN(value)) return "--";
            const rounded = parseFloat(value).toFixed(2);
            const sign = value >= 0 ? "+" : "";
            return `${sign}${rounded}%`;
        }
        
        /**
         * Fetch latest exchange rate data from the API.
         */
        async function fetchLatestData() {
            try {
                const response = await fetch(`${API_BASE}/latest`);
                const data = await response.json();
                
                if (data.status === "success" && data.data) {
                    return data.data;
                } else if (data.status === "no_data") {
                    showInfo("No data available yet. Click 'Pull Data Now' to fetch exchange rates.");
                    return null;
                } else {
                    showError("Failed to fetch data: " + (data.message || "Unknown error"));
                    return null;
                }
            } catch (error) {
                showError("Could not connect to the API. Make sure the backend is running (python app.py)");
                return null;
            }
        }
        
        /**
         * Fetch historical data for charting.
         */
        async function fetchHistoryData(limit = 50) {
            try {
                const response = await fetch(`${API_BASE}/history?currencies=${currentCurrency}&limit=${limit}`);
                const data = await response.json();
                
                if (data.status === "success") {
                    return data.data;
                } else {
                    return [];
                }
            } catch (error) {
                console.error("Failed to fetch history:", error);
                return [];
            }
        }
        
        /**
         * Update the dashboard with latest data.
         */
        async function updateDashboard() {
            updateStatus("loading", "Updating...");
            
            const latestData = await fetchLatestData();
            
            if (!latestData) {
                updateStatus("error", "Failed to load data");
                return;
            }
            
            // Update the current rate
            const rate = latestData.rates[currentCurrency];
            const metrics = latestData.metrics[currentCurrency];
            
            document.getElementById("current-rate").textContent = formatNumber(rate);
            document.getElementById("last-updated").textContent = formatDate(latestData.timestamp);
            
            // Update change metrics
            if (metrics) {
                const changeAbsolute = metrics.change_absolute || 0;
                const changePercent = metrics.change_percent || 0;
                
                document.getElementById("change-absolute").textContent = formatNumber(changeAbsolute);
                document.getElementById("change-value").textContent = formatPercentage(changePercent);
                
                // Color code based on positive/negative
                const changeValueEl = document.getElementById("change-value");
                if (changePercent > 0) {
                    changeValueEl.classList.add("positive");
                    changeValueEl.classList.remove("negative");
                } else if (changePercent < 0) {
                    changeValueEl.classList.add("negative");
                    changeValueEl.classList.remove("positive");
                }
                
                document.getElementById("change-percent").textContent = formatPercentage(changePercent);
                
                // Update rolling stats
                document.getElementById("rolling-avg").textContent = formatNumber(metrics.rolling_avg_7);
                document.getElementById("min-value").textContent = formatNumber(metrics.min_7);
                document.getElementById("max-value").textContent = formatNumber(metrics.max_7);
            }
            
            // Update the chart
            await updateChart();
            
            updateStatus("success", "Data updated");
        }
        
        /**
         * Update the historical rates chart.
         */
        async function updateChart() {
            const history = await fetchHistoryData(50);
            
            if (!history || history.length === 0) {
                console.log("No history data available");
                return;
            }
            
            // Reverse to get chronological order (oldest first)
            const labels = history.reverse().map(item => formatDate(item.timestamp, "short"));
            const data = history.map(item => item.rates[currentCurrency] || null);
            
            const ctx = document.getElementById("rate-chart").getContext("2d");
            
            // Destroy old chart if it exists
            if (chart) {
                chart.destroy();
            }
            
            chart = new Chart(ctx, {
                type: "line",
                data: {
                    labels: labels,
                    datasets: [{
                        label: `${currentCurrency}/USD`,
                        data: data,
                        borderColor: "#667eea",
                        backgroundColor: "rgba(102, 126, 234, 0.1)",
                        fill: true,
                        tension: 0.4,
                        pointRadius: 4,
                        pointBackgroundColor: "#667eea",
                        pointBorderColor: "white",
                        pointBorderWidth: 2,
                        pointHoverRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: {
                            display: true,
                            labels: {
                                font: { size: 12 },
                                color: "#333"
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: false,
                            ticks: {
                                color: "#999"
                            },
                            grid: {
                                color: "rgba(0, 0, 0, 0.05)"
                            }
                        },
                        x: {
                            ticks: {
                                color: "#999",
                                maxRotation: 45,
                                minRotation: 0
                            },
                            grid: {
                                display: false
                            }
                        }
                    }
                }
            });
        }
        
        /**
         * Format a timestamp for display.
         */
        function formatDate(timestamp, format = "long") {
            try {
                const date = new Date(timestamp);
                
                if (format === "short") {
                    return date.toLocaleString("en-US", {
                        month: "short",
                        day: "2-digit",
                        hour: "2-digit",
                        minute: "2-digit"
                    });
                } else {
                    return date.toLocaleString("en-US", {
                        year: "numeric",
                        month: "short",
                        day: "2-digit",
                        hour: "2-digit",
                        minute: "2-digit",
                        second: "2-digit"
                    });
                }
            } catch {
                return timestamp;
            }
        }
        
        /**
         * Trigger a manual data pull from the API.
         */
        async function triggerPull() {
            const button = document.getElementById("pull-button");
            button.disabled = true;
            button.textContent = "⏳ Pulling...";
            
            try {
                const response = await fetch(`${API_BASE}/pull`);
                const data = await response.json();
                
                if (data.status === "success") {
                    showInfo("✓ Data pull completed successfully");
                    // Wait a moment then refresh the dashboard
                    setTimeout(() => updateDashboard(), 500);
                } else {
                    showError("Data pull failed: " + (data.message || "Unknown error"));
                }
            } catch (error) {
                showError("Could not trigger data pull: " + error.message);
            } finally {
                button.disabled = false;
                button.textContent = "📥 Pull Data Now";
            }
        }
        
        /**
         * Update the status indicator.
         */
        function updateStatus(status, message) {
            const statusEl = document.getElementById("status");
            statusEl.className = "status " + status;
            
            const dot = statusEl.querySelector(".status-dot");
            dot.className = "status-dot " + status;
            
            statusEl.textContent = message;
            statusEl.insertBefore(dot, statusEl.firstChild);
        }
        
        /**
         * Show an error message.
         */
        function showError(message) {
            const container = document.getElementById("error-container");
            container.innerHTML = `<div class="error-message">⚠️ ${message}</div>`;
            setTimeout(() => {
                container.innerHTML = "";
            }, 5000);
        }
        
        /**
         * Show an info message.
         */
        function showInfo(message) {
            const container = document.getElementById("info-container");
            container.innerHTML = `<div class="info-message">ℹ️ ${message}</div>`;
            setTimeout(() => {
                container.innerHTML = "";
            }, 5000);
        }
        
        /**
         * Handle currency selection change.
         */
        function handleCurrencyChange(event) {
            currentCurrency = event.target.value;
            updateDashboard();
        }
        
        /**
         * Set up event listeners.
         */
        function setupEventListeners() {
            document.getElementById("currency-select").addEventListener("change", handleCurrencyChange);
            document.getElementById("pull-button").addEventListener("click", triggerPull);
            document.getElementById("refresh-button").addEventListener("click", updateDashboard);
        }
        
        /**
         * Start auto-refresh timer.
         */
        function startAutoRefresh() {
            // Update immediately
            updateDashboard();
            
            // Then update every REFRESH_INTERVAL
            if (refreshTimer) {
                clearInterval(refreshTimer);
            }
            
            refreshTimer = setInterval(updateDashboard, REFRESH_INTERVAL);
        }
        
        /**
         * Initialize the dashboard on page load.
         */
        window.addEventListener("load", () => {
            setupEventListeners();
            startAutoRefresh();
            
            // Stop refreshing if the page loses focus (to save bandwidth)
            document.addEventListener("visibilitychange", () => {
                if (document.hidden) {
                    if (refreshTimer) clearInterval(refreshTimer);
                } else {
                    startAutoRefresh();
                }
            });
        });
    </script>
</body>
</html>
